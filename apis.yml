aid: rogo
name: Rogo
description: >-
  Rogo is a New York-based artificial intelligence company building an AI
  platform purpose-built for the world's leading financial institutions. Founded
  by Gabriel Stengel, John Willett, and Tumas Rackaitis, Rogo serves 300+
  institutions and 35,000+ bankers and investors with AI agents that execute
  end-to-end financial workflows — producing institutional-grade Excel models,
  investment memos, diligence materials, and slide decks. Its platform (including
  the Felix assistant) integrates with firm systems (SharePoint, CRM) and
  financial data providers (LSEG, FactSet, Capital IQ, PitchBook, Preqin, Dow
  Jones, SEC filings) and is custom-deployed with enterprise-grade, single-tenant
  security. Customers include Truist Securities, Nomura, and Baird. Rogo raised a
  $160M Series D led by Kleiner Perkins. Rogo publishes no public developer API,
  SDKs, or API documentation; this profile captures its identity and published
  security/compliance posture.
